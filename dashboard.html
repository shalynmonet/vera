<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vera - Demo Dashboard</title>
<style>
  :root {
    --bg: #f5f4f2;
    --card-bg: #ffffff;
    --border: #e2e0dc;
    --text: #2b2926;
    --text-muted: #7a766f;
    --accent: #8a4b3b;
    --accent-light: #f1e4de;
    --routine: #3f7a4f;
    --routine-bg: #ecf5ee;
    --escalate: #b3261e;
    --escalate-bg: #fdecea;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    position: relative;
    background: var(--accent);
    color: #fff;
    padding: 22px 28px;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.12;
    background-image:
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000),
      linear-gradient(45deg, #000 25%, transparent 25%, transparent 75%, #000 75%, #000);
    background-size: 22px 22px;
    background-position: 0 0, 11px 11px;
  }
  header h1 {
    position: relative;
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header p {
    position: relative;
    margin: 4px 0 0;
    font-size: 13px;
    opacity: 0.9;
  }

  main {
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  #residentList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }

  .resident-card {
    cursor: pointer;
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .resident-card:hover {
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }

  .avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 17px;
    color: #fff;
    margin-bottom: 12px;
  }

  .resident-card h3 { margin: 0 0 4px; font-size: 17px; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--accent-light);
    color: var(--accent);
    margin-bottom: 10px;
  }
  .today-activity {
    font-size: 13px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 4px;
  }
  .today-activity strong { color: var(--text); font-weight: 600; }
  .rest-day-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #8a6d1a;
    background: #fbf1d6;
    padding: 2px 8px;
    border-radius: 999px;
  }

  #detailView { display: none; }
  .back-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    padding: 0 0 18px;
  }
  .back-btn:hover { text-decoration: underline; }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .detail-header .avatar { width: 64px; height: 64px; font-size: 20px; margin-bottom: 0; flex-shrink: 0; }
  .detail-header h2 { margin: 0 0 4px; font-size: 21px; }
  .detail-header .badge { margin-bottom: 0; }

  .profile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 18px;
  }
  @media (max-width: 620px) { .profile-grid { grid-template-columns: 1fr; } }

  .profile-grid h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); }
  .profile-grid p { margin: 0 0 3px; font-size: 14px; }

  .notes-card p { font-size: 14px; line-height: 1.5; margin: 0; }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    margin: 26px 0 12px;
  }

  .call-entry {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
    background: var(--card-bg);
  }
  .call-entry.escalated {
    border: 2px solid var(--escalate);
    background: var(--escalate-bg);
  }
  .call-entry-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .call-type-badge {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eee;
    color: #555;
  }
  .call-timestamp { font-size: 12px; color: var(--text-muted); }

  .escalation-banner {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--escalate);
    color: #fff;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .escalation-banner .icon { font-size: 18px; line-height: 1; }

  .routine-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--routine);
    background: var(--routine-bg);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  .call-summary { font-size: 14px; line-height: 1.5; margin: 0 0 8px; }
  .call-meta { font-size: 12px; color: var(--text-muted); }

  details.transcript-toggle { margin-top: 8px; }
  details.transcript-toggle summary { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 600; }
  details.transcript-toggle pre {
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    background: #faf9f7;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-top: 8px;
    max-height: 240px;
    overflow-y: auto;
  }

  .empty-state { color: var(--text-muted); font-size: 14px; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>Vera</h1>
  <p>Local demo dashboard - not the real product UI, just for showing the pipeline working</p>
</header>

<main>
  <div id="residentList"></div>

  <div id="detailView">
    <button class="back-btn" onclick="showList()">&larr; Back to residents</button>
    <div id="detailContent"></div>
  </div>
</main>

<script>
const DAY_KEYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const AVATAR_COLORS = ["#8a4b3b", "#3f6a7a", "#6b7a3f", "#7a3f6a", "#3f5a7a"];

let residents = [];
let callLog = [];

function avatarColor(name) {
  let hash = 0;
  for (const ch of name) hash = ch.charCodeAt(0) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function initials(name) {
  return name.split(" ").map(p => p[0]).join("").slice(0, 2).toUpperCase();
}

function todayKey() {
  return DAY_KEYS[new Date().getDay()];
}

function formatTimestamp(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

async function loadData() {
  const [residentsResp, logResp] = await Promise.all([
    fetch("mock_residents.json"),
    fetch("call_log.json").catch(() => null),
  ]);
  residents = await residentsResp.json();
  callLog = logResp && logResp.ok ? await logResp.json() : [];
  renderList();
}

function renderList() {
  const container = document.getElementById("residentList");
  container.innerHTML = "";
  const today = todayKey();

  for (const r of residents) {
    const todayEntry = (r.weekly_activity_schedule || {})[today];
    const card = document.createElement("div");
    card.className = "card resident-card";
    card.onclick = () => showDetail(r.id);

    let activityHtml;
    if (!todayEntry) {
      activityHtml = `<span class="empty-state">No activity scheduled today</span>`;
    } else if (todayEntry.is_rest_day) {
      activityHtml = `<span class="rest-day-tag">Rest day</span>`;
    } else {
      activityHtml = `<strong>${escapeHtml(todayEntry.activity_description || "Activity")}</strong>` +
        (todayEntry.duration_minutes ? ` &middot; ${todayEntry.duration_minutes} min` : "");
    }

    card.innerHTML = `
      <div class="avatar" style="background:${avatarColor(r.name)}">${initials(r.name)}</div>
      <h3>${escapeHtml(r.name)}</h3>
      <div class="badge">${escapeHtml(r.living_situation || "")}</div>
      <div class="today-activity">Today: ${activityHtml}</div>
    `;
    container.appendChild(card);
  }
}

function showDetail(residentId) {
  const r = residents.find(x => x.id === residentId);
  if (!r) return;

  document.getElementById("residentList").style.display = "none";
  document.getElementById("detailView").style.display = "block";

  const fc = r.family_contact || {};
  const cc = r.caregiver_contact || {};

  const entries = callLog
    .filter(e => e.resident_id === residentId)
    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  const historyHtml = entries.length
    ? entries.map(renderCallEntry).join("")
    : `<p class="empty-state">No calls logged yet for ${escapeHtml(r.name)}.</p>`;

  document.getElementById("detailContent").innerHTML = `
    <div class="detail-header">
      <div class="avatar" style="background:${avatarColor(r.name)}">${initials(r.name)}</div>
      <div>
        <h2>${escapeHtml(r.name)}</h2>
        <span class="badge">${escapeHtml(r.living_situation || "")}</span>
      </div>
    </div>

    <div class="profile-grid">
      <div class="card">
        <h4>Family Contact</h4>
        <p><strong>${escapeHtml(fc.name || "-")}</strong></p>
        ${fc.phone ? `<p>${escapeHtml(fc.phone)}</p>` : ""}
        ${fc.email ? `<p>${escapeHtml(fc.email)}</p>` : ""}
      </div>
      <div class="card">
        <h4>Caregiver Contact</h4>
        <p><strong>${escapeHtml(cc.name || "-")}</strong> ${cc.relationship ? `(${escapeHtml(cc.relationship)})` : ""}</p>
        ${cc.phone ? `<p>${escapeHtml(cc.phone)}</p>` : ""}
        ${cc.email ? `<p>${escapeHtml(cc.email)}</p>` : ""}
      </div>
    </div>

    <div class="card notes-card">
      <h4>Notes</h4>
      <p>${escapeHtml(r.notes || "-")}</p>
    </div>

    <div class="section-title">Call History</div>
    ${historyHtml}
  `;
}

function renderCallEntry(e) {
  const escalated = e.escalation && e.escalation.escalate;
  const callTypeLabel = e.call_type === "social_checkin" ? "Social Check-In" : "Activity";

  const statusBlock = escalated
    ? `<div class="escalation-banner"><span class="icon">&#9888;&#65039;</span> ESCALATED - ${escapeHtml(e.escalation.concern_summary || "")}</div>`
    : `<div class="routine-tag">&#10003; Routine</div>`;

  return `
    <div class="call-entry ${escalated ? "escalated" : ""}">
      <div class="call-entry-top">
        <span class="call-type-badge">${callTypeLabel}</span>
        <span class="call-timestamp">${formatTimestamp(e.timestamp)}</span>
      </div>
      ${statusBlock}
      <p class="call-summary">${escapeHtml(e.summary || "No summary available.")}</p>
      <div class="call-meta">Status: ${escapeHtml(e.status || "n/a")}${e.duration_seconds ? ` &middot; ${e.duration_seconds}s` : ""}</div>
      ${e.transcript ? `<details class="transcript-toggle"><summary>View transcript</summary><pre>${escapeHtml(e.transcript)}</pre></details>` : ""}
    </div>
  `;
}

function showList() {
  document.getElementById("detailView").style.display = "none";
  document.getElementById("residentList").style.display = "grid";
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

loadData();
</script>

</body>
</html>
